<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andrew's Markup — paste, annotate, copy</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b8cff'/%3E%3Cstop offset='1' stop-color='%239b5bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M13 41C18 26 26 26 31 35s11 11 20-10' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared/toolbar.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #toolbar {
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  /* ---------- Canvas area ---------- */
  #stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 24px;
    position: relative;
  }
  #canvasWrap {
    position: relative;
    display: none;
    box-shadow: 0 8px 40px rgba(0,0,0,.5);
  }
  canvas { display: block; border-radius: 4px; }
  #overlay { position: absolute; top: 0; left: 0; }

  /* ---------- Empty state ---------- */
  #empty {
    text-align: center;
    color: var(--muted);
    max-width: 460px;
  }
  #empty .big {
    font-size: 22px;
    color: var(--text);
    margin-bottom: 10px;
    font-weight: 600;
  }
  #empty .kbd { font-size: 15px; padding: 3px 9px; }
  #empty p { margin-top: 10px; line-height: 1.5; font-size: 14px; }
  #empty .paste-icon {
    width: 72px; height: 72px;
    margin: 0 auto 22px;
    border: 2px dashed var(--border);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
  }
  #empty .paste-icon svg { width: 34px; height: 34px; }
  body.dragover #empty .paste-icon { border-color: var(--accent); color: var(--accent); }

  .cursor-crosshair { cursor: crosshair; }
</style>
</head>
<body>

<div id="toolbar" class="mk-bar"></div>

<div id="stage">
  <div id="empty">
    <div class="paste-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
    </div>
    <div class="big">Paste a screenshot to start &nbsp;<span class="kbd">⌘V</span></div>
    <p>Annotate with pen, highlighter, arrows, boxes, ovals, text &amp; crop.<br>
    Click anything you've drawn to grab it — drag to move, ✕ or Delete removes it.<br>
    Then hit <span class="kbd">⇧⌘C</span> to copy the result to your clipboard.<br>
    You can also drag &amp; drop an image file here.</p>
  </div>
  <div id="canvasWrap">
    <canvas id="base"></canvas>
    <canvas id="overlay" class="cursor-crosshair"></canvas>
  </div>
</div>

<script src="shared/markup-core.js"></script>
<script src="shared/toolbar.js"></script>
<script src="app.js"></script>
</body>
</html>
