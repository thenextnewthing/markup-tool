<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andrew's Markup — paste, annotate, copy</title>
<style>
  :root {
    --bg: #1e2128;
    --panel: #2a2e38;
    --panel-2: #343945;
    --border: #3d4350;
    --text: #e8eaf0;
    --muted: #9aa1b0;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Toolbar ---------- */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    user-select: none;
    -webkit-user-select: none;
  }
  .group {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px;
    background: var(--panel-2);
    border-radius: 10px;
  }
  .tool-btn {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .tool-btn:hover { background: #404656; }
  .tool-btn.active { background: var(--accent); color: #fff; }
  .tool-btn svg { width: 20px; height: 20px; }

  .swatch {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.15);
  }
  .swatch.active {
    border-color: #fff;
    transform: scale(1.12);
  }

  .size-btn {
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .size-btn:hover { background: #404656; }
  .size-btn.active { background: var(--accent); }
  .size-btn .dot { border-radius: 50%; background: currentColor; }

  .action-btn {
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    height: 38px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
  }
  .action-btn:hover { background: #404656; }
  .action-btn:disabled { opacity: .35; cursor: default; }
  .action-btn:disabled:hover { background: transparent; }
  .action-btn svg { width: 18px; height: 18px; }

  #copyBtn {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  #copyBtn:hover { background: #4a7bf0; }
  .kbd {
    font-size: 11px;
    opacity: .75;
    background: rgba(255,255,255,.15);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .spacer { flex: 1; }
  #autoPasteLabel {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
  }
  #autoPasteLabel:hover { color: var(--text); }
  #autoPasteLabel input {
    width: 15px;
    height: 15px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  #brand {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .3px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #brand .logo {
    width: 22px; height: 22px;
    background: linear-gradient(135deg, #5b8cff, #9b5bff);
    border-radius: 6px;
  }

  /* ---------- Canvas area ---------- */
  #stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 24px;
    position: relative;
  }
  #canvasWrap {
    position: relative;
    display: none;
    box-shadow: 0 8px 40px rgba(0,0,0,.5);
  }
  canvas { display: block; border-radius: 4px; }
  #overlay { position: absolute; top: 0; left: 0; }

  /* ---------- Empty state ---------- */
  #empty {
    text-align: center;
    color: var(--muted);
    max-width: 460px;
  }
  #empty .big {
    font-size: 22px;
    color: var(--text);
    margin-bottom: 10px;
    font-weight: 600;
  }
  #empty .kbd { font-size: 15px; padding: 3px 9px; }
  #empty p { margin-top: 10px; line-height: 1.5; font-size: 14px; }
  #empty .paste-icon {
    width: 72px; height: 72px;
    margin: 0 auto 22px;
    border: 2px dashed var(--border);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
  }
  #empty .paste-icon svg { width: 34px; height: 34px; }
  body.dragover #empty .paste-icon { border-color: var(--accent); color: var(--accent); }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #11131a;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 14px;
    transition: transform .25s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: none;
    z-index: 50;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast .check { color: #4ade80; }

  .cursor-crosshair { cursor: crosshair; }
</style>
</head>
<body>

<div id="toolbar">
  <div id="brand"><div class="logo"></div>Andrew's Markup</div>

  <div class="group" id="tools">
    <button class="tool-btn active" data-tool="pen" title="Pen (P)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
    </button>
    <button class="tool-btn" data-tool="highlighter" title="Highlighter (H)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
    </button>
    <button class="tool-btn" data-tool="arrow" title="Arrow (A)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="9 5 19 5 19 15"/></svg>
    </button>
    <button class="tool-btn" data-tool="rect" title="Box (R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
    </button>
    <button class="tool-btn" data-tool="oval" title="Oval (O)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="9" ry="6.5"/></svg>
    </button>
  </div>

  <div class="group" id="colors"></div>

  <div class="group" id="sizes">
    <button class="size-btn" data-size="S" title="Thin"><span class="dot" style="width:4px;height:4px"></span></button>
    <button class="size-btn active" data-size="M" title="Medium"><span class="dot" style="width:8px;height:8px"></span></button>
    <button class="size-btn" data-size="L" title="Thick"><span class="dot" style="width:13px;height:13px"></span></button>
    <button class="size-btn" data-size="XL" title="Extra thick"><span class="dot" style="width:19px;height:19px"></span></button>
    <button class="size-btn" data-size="XXL" title="Huge"><span class="dot" style="width:26px;height:26px"></span></button>
  </div>

  <div class="group">
    <button class="action-btn" id="undoBtn" title="Undo (⌘Z)" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
    </button>
    <button class="action-btn" id="redoBtn" title="Redo (⇧⌘Z)" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
    </button>
    <button class="action-btn" id="clearBtn" title="Start over" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    </button>
  </div>

  <div class="spacer"></div>

  <label id="autoPasteLabel" title="When checked, the clipboard image is pasted automatically when the page loads">
    <input type="checkbox" id="autoPasteCb"> Auto paste
  </label>

  <button class="action-btn" id="copyBtn" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    Copy <span class="kbd">⇧⌘C</span>
  </button>
</div>

<div id="stage">
  <div id="empty">
    <div class="paste-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
    </div>
    <div class="big">Paste a screenshot to start &nbsp;<span class="kbd">⌘V</span></div>
    <p>Annotate with pen, highlighter, arrows, boxes &amp; ovals.<br>
    Then hit <span class="kbd">⇧⌘C</span> to copy the result to your clipboard.<br>
    You can also drag &amp; drop an image file here.</p>
  </div>
  <div id="canvasWrap">
    <canvas id="base"></canvas>
    <canvas id="overlay" class="cursor-crosshair"></canvas>
  </div>
</div>

<div id="toast"><span class="check">✓</span><span id="toastMsg">Copied to clipboard</span></div>

<script>
(() => {
  'use strict';

  // ---------- State ----------
  const COLORS = ['#ef4444', '#f97316', '#facc15', '#22c55e', '#3b82f6', '#a855f7', '#111111', '#ffffff'];
  const SIZES = { S: 2.5, M: 5, L: 10, XL: 18, XXL: 30 };

  let img = null;            // HTMLImageElement / ImageBitmap of the pasted image
  let shapes = [];           // committed shapes
  let redoStack = [];
  let tool = 'pen';
  let color = COLORS[0];
  let sizeKey = 'M';
  let drawing = null;        // in-progress shape

  const base = document.getElementById('base');
  const overlay = document.getElementById('overlay');
  const bctx = base.getContext('2d');
  const octx = overlay.getContext('2d');
  const wrap = document.getElementById('canvasWrap');
  const empty = document.getElementById('empty');
  const stage = document.getElementById('stage');

  // ---------- Toolbar wiring ----------
  const toolBtns = [...document.querySelectorAll('.tool-btn')];
  toolBtns.forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
  function setTool(t) {
    tool = t;
    toolBtns.forEach(b => b.classList.toggle('active', b.dataset.tool === t));
  }

  const colorsEl = document.getElementById('colors');
  COLORS.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'swatch' + (i === 0 ? ' active' : '');
    b.style.background = c;
    b.title = c;
    b.addEventListener('click', () => {
      color = c;
      [...colorsEl.children].forEach(x => x.classList.toggle('active', x === b));
    });
    colorsEl.appendChild(b);
  });

  const sizeBtns = [...document.querySelectorAll('.size-btn')];
  sizeBtns.forEach(b => b.addEventListener('click', () => {
    sizeKey = b.dataset.size;
    sizeBtns.forEach(x => x.classList.toggle('active', x === b));
  }));

  const undoBtn = document.getElementById('undoBtn');
  const redoBtn = document.getElementById('redoBtn');
  const clearBtn = document.getElementById('clearBtn');
  const copyBtn = document.getElementById('copyBtn');
  undoBtn.addEventListener('click', undo);
  redoBtn.addEventListener('click', redo);
  clearBtn.addEventListener('click', () => { if (img) loadImage(img); });
  copyBtn.addEventListener('click', copyResult);

  function syncButtons() {
    undoBtn.disabled = shapes.length === 0;
    redoBtn.disabled = redoStack.length === 0;
    clearBtn.disabled = !img;
    copyBtn.disabled = !img;
  }

  // ---------- Image loading ----------
  function loadImage(image) {
    img = image;
    shapes = [];
    redoStack = [];
    base.width = overlay.width = image.naturalWidth || image.width;
    base.height = overlay.height = image.naturalHeight || image.height;
    fitCanvas();
    empty.style.display = 'none';
    wrap.style.display = 'block';
    redrawBase();
    syncButtons();
  }

  function fitCanvas() {
    if (!img) return;
    const iw = base.width, ih = base.height;
    const maxW = stage.clientWidth - 48;
    const maxH = stage.clientHeight - 48;
    const scale = Math.min(1, maxW / iw, maxH / ih);
    wrap.style.width = base.style.width = overlay.style.width = (iw * scale) + 'px';
    wrap.style.height = base.style.height = overlay.style.height = (ih * scale) + 'px';
  }
  window.addEventListener('resize', fitCanvas);

  function handleBlob(blob) {
    if (!blob || !blob.type.startsWith('image/')) return false;
    const url = URL.createObjectURL(blob);
    const image = new Image();
    image.onload = () => { loadImage(image); URL.revokeObjectURL(url); };
    image.src = url;
    return true;
  }

  // Paste anywhere on the page
  window.addEventListener('paste', e => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        handleBlob(item.getAsFile());
        return;
      }
    }
  });

  // Drag & drop
  window.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragover'); });
  window.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragover'); });
  window.addEventListener('drop', e => {
    e.preventDefault();
    document.body.classList.remove('dragover');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleBlob(f);
  });

  // ---------- Drawing ----------
  function pos(e) {
    const r = overlay.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (overlay.width / r.width),
      y: (e.clientY - r.top) * (overlay.height / r.height),
    };
  }

  overlay.addEventListener('pointerdown', e => {
    if (!img || e.button !== 0) return;
    overlay.setPointerCapture(e.pointerId);
    const p = pos(e);
    const lw = SIZES[sizeKey] * (tool === 'highlighter' ? 2.4 : 1);
    drawing = { tool, color, lw, x0: p.x, y0: p.y, x1: p.x, y1: p.y, points: [p] };
    renderShape(octx, drawing);
  });

  overlay.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pos(e);
    drawing.x1 = p.x;
    drawing.y1 = p.y;
    if (drawing.tool === 'pen' || drawing.tool === 'highlighter') drawing.points.push(p);
    octx.clearRect(0, 0, overlay.width, overlay.height);
    renderShape(octx, drawing);
  });

  function finishStroke() {
    if (!drawing) return;
    octx.clearRect(0, 0, overlay.width, overlay.height);
    // Ignore zero-size accidental clicks for shapes; keep dots for pen
    const moved = Math.hypot(drawing.x1 - drawing.x0, drawing.y1 - drawing.y0) > 2 || drawing.points.length > 2;
    if (moved || drawing.tool === 'pen' || drawing.tool === 'highlighter') {
      shapes.push(drawing);
      redoStack = [];
      drawShapeOnBase(drawing);
    }
    drawing = null;
    syncButtons();
  }
  overlay.addEventListener('pointerup', finishStroke);
  overlay.addEventListener('pointercancel', () => { drawing = null; octx.clearRect(0, 0, overlay.width, overlay.height); });

  function renderShape(ctx, s) {
    ctx.save();
    ctx.strokeStyle = s.color;
    ctx.fillStyle = s.color;
    ctx.lineWidth = s.lw;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (s.tool === 'highlighter') {
      ctx.globalAlpha = 0.4;
      ctx.lineCap = 'butt';
    }
    switch (s.tool) {
      case 'pen':
      case 'highlighter': {
        ctx.beginPath();
        const pts = s.points;
        ctx.moveTo(pts[0].x, pts[0].y);
        if (pts.length === 1) {
          ctx.lineTo(pts[0].x + .01, pts[0].y + .01);
        } else {
          for (let i = 1; i < pts.length - 1; i++) {
            const mx = (pts[i].x + pts[i + 1].x) / 2;
            const my = (pts[i].y + pts[i + 1].y) / 2;
            ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
          }
          const last = pts[pts.length - 1];
          ctx.lineTo(last.x, last.y);
        }
        ctx.stroke();
        break;
      }
      case 'arrow': {
        const { x0, y0, x1, y1 } = s;
        const angle = Math.atan2(y1 - y0, x1 - x0);
        const head = Math.max(10, s.lw * 3.2);
        // shorten shaft so it doesn't poke through the head
        const sx = x1 - Math.cos(angle) * head * 0.6;
        const sy = y1 - Math.sin(angle) * head * 0.6;
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(sx, sy);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x1 - head * Math.cos(angle - Math.PI / 6.5), y1 - head * Math.sin(angle - Math.PI / 6.5));
        ctx.lineTo(x1 - head * Math.cos(angle + Math.PI / 6.5), y1 - head * Math.sin(angle + Math.PI / 6.5));
        ctx.closePath();
        ctx.fill();
        break;
      }
      case 'rect': {
        const x = Math.min(s.x0, s.x1), y = Math.min(s.y0, s.y1);
        const w = Math.abs(s.x1 - s.x0), h = Math.abs(s.y1 - s.y0);
        const r = Math.min(6, w / 2, h / 2);
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
        ctx.stroke();
        break;
      }
      case 'oval': {
        const cx = (s.x0 + s.x1) / 2, cy = (s.y0 + s.y1) / 2;
        const rx = Math.abs(s.x1 - s.x0) / 2, ry = Math.abs(s.y1 - s.y0) / 2;
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        ctx.stroke();
        break;
      }
    }
    ctx.restore();
  }

  function drawShapeOnBase(s) { renderShape(bctx, s); }

  function redrawBase() {
    bctx.clearRect(0, 0, base.width, base.height);
    if (img) bctx.drawImage(img, 0, 0);
    shapes.forEach(s => renderShape(bctx, s));
  }

  // ---------- Undo / redo ----------
  function undo() {
    if (!shapes.length) return;
    redoStack.push(shapes.pop());
    redrawBase();
    syncButtons();
  }
  function redo() {
    if (!redoStack.length) return;
    const s = redoStack.pop();
    shapes.push(s);
    drawShapeOnBase(s);
    syncButtons();
  }

  // ---------- Copy ----------
  async function copyResult() {
    if (!img) return;
    try {
      // Safari requires the promise to be passed to ClipboardItem synchronously
      const blobPromise = new Promise((res, rej) =>
        base.toBlob(b => b ? res(b) : rej(new Error('toBlob failed')), 'image/png'));
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blobPromise })]);
      toast('Copied to clipboard');
    } catch (err) {
      try {
        const blob = await new Promise((res, rej) =>
          base.toBlob(b => b ? res(b) : rej(new Error('toBlob failed')), 'image/png'));
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        toast('Copied to clipboard');
      } catch (err2) {
        toast('Copy failed — check clipboard permissions', true);
      }
    }
  }

  let toastTimer;
  function toast(msg, isError) {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.querySelector('.check').textContent = isError ? '✕' : '✓';
    t.querySelector('.check').style.color = isError ? '#f87171' : '#4ade80';
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ---------- Auto paste ----------
  const autoPasteCb = document.getElementById('autoPasteCb');
  autoPasteCb.checked = localStorage.getItem('autoPaste') === '1';
  autoPasteCb.addEventListener('change', () => {
    localStorage.setItem('autoPaste', autoPasteCb.checked ? '1' : '0');
    if (autoPasteCb.checked) tryAutoPaste();
  });

  async function tryAutoPaste() {
    if (img || !navigator.clipboard || !navigator.clipboard.read) return;
    try {
      const items = await navigator.clipboard.read();
      for (const item of items) {
        const type = item.types.find(t => t.startsWith('image/'));
        if (type) {
          handleBlob(await item.getType(type));
          return;
        }
      }
    } catch (err) {
      // No permission, document not focused, or non-image clipboard — stay on empty state
    }
  }

  if (autoPasteCb.checked) {
    if (document.hasFocus()) tryAutoPaste();
  }
  // Also fire when returning to an empty tab (e.g. right after taking a screenshot)
  window.addEventListener('focus', () => {
    if (autoPasteCb.checked && !img) tryAutoPaste();
  });

  // ---------- Keyboard shortcuts ----------
  window.addEventListener('keydown', e => {
    const mod = e.metaKey || e.ctrlKey;

    if (mod && e.shiftKey && e.code === 'KeyC') {
      e.preventDefault();
      copyResult();
      return;
    }
    if (mod && e.code === 'KeyZ') {
      e.preventDefault();
      e.shiftKey ? redo() : undo();
      return;
    }
    if (mod) return;

    switch (e.code) {
      case 'KeyP': setTool('pen'); break;
      case 'KeyH': setTool('highlighter'); break;
      case 'KeyA': setTool('arrow'); break;
      case 'KeyR': setTool('rect'); break;
      case 'KeyO': setTool('oval'); break;
    }
  });

  syncButtons();
})();
</script>
</body>
</html>
