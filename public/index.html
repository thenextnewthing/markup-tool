<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andrew's Markup — paste, annotate, copy</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b8cff'/%3E%3Cstop offset='1' stop-color='%239b5bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M13 41C18 26 26 26 31 35s11 11 20-10' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #1e2128;
    --panel: #2a2e38;
    --panel-2: #343945;
    --border: #3d4350;
    --text: #e8eaf0;
    --muted: #9aa1b0;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Toolbar ---------- */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: nowrap;
    user-select: none;
    -webkit-user-select: none;
  }
  .group {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 3px;
    background: var(--panel-2);
    border-radius: 10px;
    flex: none;
  }
  .tool-btn {
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .tool-btn:hover { background: #404656; }
  .tool-btn.active { background: var(--accent); color: #fff; }
  .tool-btn svg { width: 18px; height: 18px; }

  .swatch {
    width: 21px;
    height: 21px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.15);
  }
  .swatch.active {
    border-color: #fff;
    transform: scale(1.12);
  }

  .size-btn {
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    width: 28px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .size-btn:hover { background: #404656; }
  .size-btn.active { background: var(--accent); }
  .size-btn .dot { border-radius: 50%; background: currentColor; }

  .action-btn {
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    height: 32px;
    padding: 0 9px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    white-space: nowrap;
    flex: none;
  }
  .action-btn:hover { background: #404656; }
  .action-btn:disabled { opacity: .35; cursor: default; }
  .action-btn:disabled:hover { background: transparent; }
  .action-btn svg { width: 18px; height: 18px; }

  #copyBtn {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  #copyBtn:hover { background: #4a7bf0; }
  .kbd {
    font-size: 11px;
    opacity: .75;
    background: rgba(255,255,255,.15);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .spacer { flex: 1; }
  /* ---------- Settings (gear) dropdown ---------- */
  #settings { position: relative; flex: none; }
  #settingsMenu {
    display: none;
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    width: 300px;
    box-shadow: 0 12px 34px rgba(0,0,0,.5);
    z-index: 60;
  }
  /* invisible bridge so the menu doesn't close crossing the gap below the gear */
  #settingsMenu::before {
    content: "";
    position: absolute;
    top: -8px; left: 0; right: 0;
    height: 8px;
  }
  #settings:hover #settingsMenu { display: block; }
  #settings:hover #gearBtn { background: #404656; }
  .menu-option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .menu-option:hover { background: var(--panel-2); }
  .menu-option input {
    width: 15px;
    height: 15px;
    accent-color: var(--accent);
    cursor: pointer;
    flex: none;
    margin-top: 2px;
  }
  .menu-option .t { font-size: 13px; font-weight: 600; }
  .menu-option .d { font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 2px; }
  #brand {
    font-weight: 700;
    font-size: 14px;
    letter-spacing: .3px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex: none;
  }
  @media (max-width: 1240px) {
    #brand .brand-text { display: none; }
  }
  #brand .logo { width: 22px; height: 22px; display: block; }

  /* ---------- Canvas area ---------- */
  #stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 24px;
    position: relative;
  }
  #canvasWrap {
    position: relative;
    display: none;
    box-shadow: 0 8px 40px rgba(0,0,0,.5);
  }
  canvas { display: block; border-radius: 4px; }
  #overlay { position: absolute; top: 0; left: 0; }

  /* ---------- Empty state ---------- */
  #empty {
    text-align: center;
    color: var(--muted);
    max-width: 460px;
  }
  #empty .big {
    font-size: 22px;
    color: var(--text);
    margin-bottom: 10px;
    font-weight: 600;
  }
  #empty .kbd { font-size: 15px; padding: 3px 9px; }
  #empty p { margin-top: 10px; line-height: 1.5; font-size: 14px; }
  #empty .paste-icon {
    width: 72px; height: 72px;
    margin: 0 auto 22px;
    border: 2px dashed var(--border);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
  }
  #empty .paste-icon svg { width: 34px; height: 34px; }
  body.dragover #empty .paste-icon { border-color: var(--accent); color: var(--accent); }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #11131a;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 14px;
    transition: transform .25s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: none;
    z-index: 50;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast .check { color: #4ade80; }

  .cursor-crosshair { cursor: crosshair; }

  #textEditor {
    position: absolute;
    background: transparent;
    border: 1.5px dashed rgba(91,140,255,.85);
    border-radius: 4px;
    outline: none;
    resize: none;
    padding: 2px 4px;
    margin: 0;
    font-weight: 700;
    line-height: 1.22;
    white-space: pre;
    overflow: hidden;
    z-index: 5;
  }
</style>
</head>
<body>

<div id="toolbar">
  <div id="brand">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <defs><linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#9b5bff"/>
      </linearGradient></defs>
      <rect width="64" height="64" rx="14" fill="url(#logoGrad)"/>
      <path d="M13 41C18 26 26 26 31 35s11 11 20-10" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    </svg>
    <span class="brand-text">Andrew's Markup</span>
  </div>

  <div class="group" id="tools">
    <button class="tool-btn" data-tool="select" title="Select (V) — click an object, drag to move it, Delete or the red ✕ removes it">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3l7 17 2.5-7 7-2.5z"/></svg>
    </button>
    <button class="tool-btn active" data-tool="pen" title="Pen (P)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
    </button>
    <button class="tool-btn" data-tool="highlighter" title="Highlighter (H)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
    </button>
    <button class="tool-btn" data-tool="arrow" title="Arrow (A)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="9 5 19 5 19 15"/></svg>
    </button>
    <button class="tool-btn" data-tool="sarrow" title="Skitch arrow (S)">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M4.5 20.5 L15.6 10.9 L17.5 12.8 L20 4 L11.2 6.5 L13.1 8.4 L3.5 19.5 Z"/></svg>
    </button>
    <button class="tool-btn" data-tool="text" title="Text (T) — click where you want it, type, press Enter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
    </button>
    <button class="tool-btn" data-tool="rect" title="Box (R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
    </button>
    <button class="tool-btn" data-tool="oval" title="Oval (O)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="9" ry="6.5"/></svg>
    </button>
  </div>

  <div class="group" id="colors"></div>

  <div class="group" id="sizes">
    <button class="size-btn" data-size="S" title="Thin"><span class="dot" style="width:4px;height:4px"></span></button>
    <button class="size-btn active" data-size="M" title="Medium"><span class="dot" style="width:7px;height:7px"></span></button>
    <button class="size-btn" data-size="L" title="Thick"><span class="dot" style="width:10px;height:10px"></span></button>
    <button class="size-btn" data-size="XL" title="Extra thick"><span class="dot" style="width:14px;height:14px"></span></button>
    <button class="size-btn" data-size="XXL" title="Huge"><span class="dot" style="width:19px;height:19px"></span></button>
  </div>

  <div class="group">
    <button class="action-btn" id="undoBtn" title="Undo (⌘Z)" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
    </button>
    <button class="action-btn" id="redoBtn" title="Redo (⇧⌘Z)" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
    </button>
    <button class="action-btn" id="clearBtn" title="Start over" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    </button>
  </div>

  <div class="spacer"></div>

  <div id="settings">
    <button class="action-btn" id="gearBtn" title="Options">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <div id="settingsMenu">
      <label class="menu-option">
        <input type="checkbox" id="handDrawnCb">
        <div>
          <div class="t">Hand-drawn</div>
          <div class="d">Gives arrows, boxes &amp; ovals a wobbly, sketched-by-hand look instead of perfect geometry. Checking or unchecking it also restyles everything already drawn on the image.</div>
        </div>
      </label>
      <label class="menu-option">
        <input type="checkbox" id="autoPasteCb">
        <div>
          <div class="t">Auto paste</div>
          <div class="d">Automatically loads the image from your clipboard the moment you open or switch back to this tab — take a screenshot, come here, and it's already on the canvas. No need to press ⌘V.</div>
        </div>
      </label>
    </div>
  </div>

  <button class="action-btn" id="copyBtn" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    Copy <span class="kbd">⇧⌘C</span>
  </button>
</div>

<div id="stage">
  <div id="empty">
    <div class="paste-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
    </div>
    <div class="big">Paste a screenshot to start &nbsp;<span class="kbd">⌘V</span></div>
    <p>Annotate with pen, highlighter, arrows, boxes, ovals &amp; text.<br>
    The select tool (V) moves or deletes anything you've drawn.<br>
    Then hit <span class="kbd">⇧⌘C</span> to copy the result to your clipboard.<br>
    You can also drag &amp; drop an image file here.</p>
  </div>
  <div id="canvasWrap">
    <canvas id="base"></canvas>
    <canvas id="overlay" class="cursor-crosshair"></canvas>
  </div>
</div>

<div id="toast"><span class="check">✓</span><span id="toastMsg">Copied to clipboard</span></div>

<script>
(() => {
  'use strict';

  // ---------- State ----------
  const COLORS = ['#ef4444', '#f97316', '#facc15', '#22c55e', '#3b82f6', '#a855f7', '#111111', '#ffffff'];
  const SIZES = { S: 2.5, M: 5, L: 10, XL: 18, XXL: 30 };
  const FONTS = { S: 18, M: 26, L: 38, XL: 56, XXL: 80 };

  let img = null;            // HTMLImageElement / ImageBitmap of the pasted image
  let shapes = [];           // committed shapes
  let history = [];          // undo snapshots of the shapes array
  let future = [];           // redo snapshots
  let tool = 'pen';
  let color = COLORS[0];
  let sizeKey = 'M';
  let drawing = null;        // in-progress shape
  let selected = null;       // shape picked with the select tool
  let draggingSel = false;
  let dragStart = null;
  let dragMoved = false;
  let handDrawn = localStorage.getItem('handDrawn') === '1';

  function snapshot() { history.push(shapes.slice()); future = []; }

  const base = document.getElementById('base');
  const overlay = document.getElementById('overlay');
  const bctx = base.getContext('2d');
  const octx = overlay.getContext('2d');
  const wrap = document.getElementById('canvasWrap');
  const empty = document.getElementById('empty');
  const stage = document.getElementById('stage');

  // ---------- Toolbar wiring ----------
  const toolBtns = [...document.querySelectorAll('.tool-btn')];
  toolBtns.forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
  function setTool(t) {
    tool = t;
    toolBtns.forEach(b => b.classList.toggle('active', b.dataset.tool === t));
    if (t !== 'select' && selected) { selected = null; drawSel(); }
    overlay.style.cursor = t === 'select' ? 'default' : t === 'text' ? 'text' : 'crosshair';
  }

  const colorsEl = document.getElementById('colors');
  COLORS.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'swatch' + (i === 0 ? ' active' : '');
    b.style.background = c;
    b.title = c;
    b.addEventListener('click', () => {
      color = c;
      [...colorsEl.children].forEach(x => x.classList.toggle('active', x === b));
    });
    colorsEl.appendChild(b);
  });

  const sizeBtns = [...document.querySelectorAll('.size-btn')];
  sizeBtns.forEach(b => b.addEventListener('click', () => {
    sizeKey = b.dataset.size;
    sizeBtns.forEach(x => x.classList.toggle('active', x === b));
  }));

  const undoBtn = document.getElementById('undoBtn');
  const redoBtn = document.getElementById('redoBtn');
  const clearBtn = document.getElementById('clearBtn');
  const copyBtn = document.getElementById('copyBtn');
  undoBtn.addEventListener('click', undo);
  redoBtn.addEventListener('click', redo);
  clearBtn.addEventListener('click', () => { if (img) loadImage(img); });
  copyBtn.addEventListener('click', copyResult);

  function syncButtons() {
    undoBtn.disabled = history.length === 0;
    redoBtn.disabled = future.length === 0;
    clearBtn.disabled = !img;
    copyBtn.disabled = !img;
  }

  // ---------- Image loading ----------
  function loadImage(image) {
    img = image;
    shapes = [];
    history = [];
    future = [];
    selected = null;
    closeTextEditor(false);
    base.width = overlay.width = image.naturalWidth || image.width;
    base.height = overlay.height = image.naturalHeight || image.height;
    fitCanvas();
    empty.style.display = 'none';
    wrap.style.display = 'block';
    redrawBase();
    syncButtons();
  }

  function fitCanvas() {
    if (!img) return;
    const iw = base.width, ih = base.height;
    const maxW = stage.clientWidth - 48;
    const maxH = stage.clientHeight - 48;
    const scale = Math.min(1, maxW / iw, maxH / ih);
    wrap.style.width = base.style.width = overlay.style.width = (iw * scale) + 'px';
    wrap.style.height = base.style.height = overlay.style.height = (ih * scale) + 'px';
  }
  window.addEventListener('resize', fitCanvas);

  function handleBlob(blob) {
    if (!blob || !blob.type.startsWith('image/')) return false;
    const url = URL.createObjectURL(blob);
    const image = new Image();
    image.onload = () => { loadImage(image); URL.revokeObjectURL(url); };
    image.src = url;
    return true;
  }

  // Paste anywhere on the page
  window.addEventListener('paste', e => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        handleBlob(item.getAsFile());
        return;
      }
    }
  });

  // Drag & drop
  window.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragover'); });
  window.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragover'); });
  window.addEventListener('drop', e => {
    e.preventDefault();
    document.body.classList.remove('dragover');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleBlob(f);
  });

  // ---------- Drawing ----------
  function pos(e) {
    const r = overlay.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (overlay.width / r.width),
      y: (e.clientY - r.top) * (overlay.height / r.height),
    };
  }

  overlay.addEventListener('pointerdown', e => {
    if (!img || e.button !== 0) return;
    const p = pos(e);

    if (tool === 'select') {
      // red ✕ on the current selection?
      if (selected && selected._delBtn) {
        const d = selected._delBtn;
        if (Math.hypot(p.x - d.x, p.y - d.y) <= d.r) { deleteSelected(); return; }
      }
      const hit = hitTest(p);
      selected = hit;
      if (hit) {
        // replace with a clone so the undo snapshot keeps the original coords
        snapshot();
        const clone = { ...hit, points: hit.points ? hit.points.map(q => ({ x: q.x, y: q.y })) : undefined };
        shapes[shapes.indexOf(hit)] = clone;
        selected = clone;
        overlay.setPointerCapture(e.pointerId);
        draggingSel = true;
        dragStart = p;
        dragMoved = false;
      }
      drawSel();
      syncButtons();
      return;
    }

    if (tool === 'text') {
      openTextEditor(p);
      return;
    }

    if (selected) { selected = null; drawSel(); }
    overlay.setPointerCapture(e.pointerId);
    const lw = SIZES[sizeKey] * (tool === 'highlighter' ? 2.4 : 1);
    drawing = { tool, color, lw, x0: p.x, y0: p.y, x1: p.x, y1: p.y, points: [p], seed: (Math.random() * 2 ** 31) | 0 };
    renderShape(octx, drawing);
  });

  overlay.addEventListener('pointermove', e => {
    if (draggingSel && selected) {
      const p = pos(e);
      translateShape(selected, p.x - dragStart.x, p.y - dragStart.y);
      dragStart = p;
      dragMoved = true;
      redrawBase();
      drawSel();
      return;
    }
    if (!drawing) return;
    const p = pos(e);
    drawing.x1 = p.x;
    drawing.y1 = p.y;
    if (drawing.tool === 'pen' || drawing.tool === 'highlighter') drawing.points.push(p);
    octx.clearRect(0, 0, overlay.width, overlay.height);
    renderShape(octx, drawing);
  });

  function finishStroke() {
    if (draggingSel) {
      draggingSel = false;
      if (!dragMoved) history.pop();   // plain click: keep selection, drop the no-op snapshot
      syncButtons();
      return;
    }
    if (!drawing) return;
    octx.clearRect(0, 0, overlay.width, overlay.height);
    // Ignore zero-size accidental clicks for shapes; keep dots for pen
    const moved = Math.hypot(drawing.x1 - drawing.x0, drawing.y1 - drawing.y0) > 2 || drawing.points.length > 2;
    if (moved || drawing.tool === 'pen' || drawing.tool === 'highlighter') {
      snapshot();
      shapes.push(drawing);
      drawShapeOnBase(drawing);
    }
    drawing = null;
    syncButtons();
  }
  overlay.addEventListener('pointerup', finishStroke);
  overlay.addEventListener('pointercancel', () => {
    drawing = null;
    if (draggingSel) { draggingSel = false; if (!dragMoved) history.pop(); }
    octx.clearRect(0, 0, overlay.width, overlay.height);
    drawSel();
  });

  // ---------- Selection: hit test, move, delete ----------
  function textMetrics(s) {
    octx.font = textFont(s.fontSize);
    const lines = s.text.split('\n');
    let w = 0;
    lines.forEach(l => { w = Math.max(w, octx.measureText(l).width); });
    return { w, h: lines.length * s.fontSize * 1.22 };
  }

  function bboxOf(s) {
    if (s.tool === 'text') {
      const m = textMetrics(s);
      return { x: s.x, y: s.y, w: m.w, h: m.h };
    }
    let minx, miny, maxx, maxy;
    if (s.points && (s.tool === 'pen' || s.tool === 'highlighter')) {
      minx = maxx = s.points[0].x; miny = maxy = s.points[0].y;
      s.points.forEach(q => {
        minx = Math.min(minx, q.x); maxx = Math.max(maxx, q.x);
        miny = Math.min(miny, q.y); maxy = Math.max(maxy, q.y);
      });
    } else {
      minx = Math.min(s.x0, s.x1); maxx = Math.max(s.x0, s.x1);
      miny = Math.min(s.y0, s.y1); maxy = Math.max(s.y0, s.y1);
    }
    const pad = s.tool === 'sarrow' ? Math.max(8, s.lw * 2)
              : s.tool === 'arrow' ? Math.max(5, s.lw * 1.6)
              : s.lw / 2 + 2;
    return { x: minx - pad, y: miny - pad, w: maxx - minx + pad * 2, h: maxy - miny + pad * 2 };
  }

  function hitTest(p) {
    const slack = 6 / viewScale();
    for (let i = shapes.length - 1; i >= 0; i--) {
      const b = bboxOf(shapes[i]);
      if (p.x >= b.x - slack && p.x <= b.x + b.w + slack &&
          p.y >= b.y - slack && p.y <= b.y + b.h + slack) return shapes[i];
    }
    return null;
  }

  function translateShape(s, dx, dy) {
    if (s.tool === 'text') { s.x += dx; s.y += dy; return; }
    s.x0 += dx; s.x1 += dx; s.y0 += dy; s.y1 += dy;
    if (s.points) s.points.forEach(q => { q.x += dx; q.y += dy; });
  }

  function deleteSelected() {
    if (!selected) return;
    snapshot();
    shapes = shapes.filter(s => s !== selected);
    selected = null;
    redrawBase();
    drawSel();
    syncButtons();
  }

  function viewScale() {
    const r = overlay.getBoundingClientRect();
    return (r.width / overlay.width) || 1;
  }

  // Selection outline + red ✕ delete button, sized to look constant on screen
  function drawSel() {
    octx.clearRect(0, 0, overlay.width, overlay.height);
    if (!selected) return;
    const u = 1 / viewScale();
    const b = bboxOf(selected);
    octx.save();
    octx.strokeStyle = '#5b8cff';
    octx.lineWidth = 1.5 * u;
    octx.setLineDash([6 * u, 4 * u]);
    octx.strokeRect(b.x - 6 * u, b.y - 6 * u, b.w + 12 * u, b.h + 12 * u);
    octx.setLineDash([]);
    const cx = Math.min(overlay.width - 14 * u, b.x + b.w + 16 * u);
    const cy = Math.max(14 * u, b.y - 16 * u);
    octx.beginPath();
    octx.arc(cx, cy, 11 * u, 0, Math.PI * 2);
    octx.fillStyle = '#ef4444';
    octx.fill();
    octx.strokeStyle = '#fff';
    octx.lineWidth = 2.2 * u;
    octx.beginPath();
    octx.moveTo(cx - 4.5 * u, cy - 4.5 * u); octx.lineTo(cx + 4.5 * u, cy + 4.5 * u);
    octx.moveTo(cx + 4.5 * u, cy - 4.5 * u); octx.lineTo(cx - 4.5 * u, cy + 4.5 * u);
    octx.stroke();
    octx.restore();
    selected._delBtn = { x: cx, y: cy, r: 14 * u };
  }

  // ---------- Text ----------
  function textFont(size) {
    const fam = handDrawn
      ? "'Chalkboard SE','Comic Sans MS',cursive"
      : "-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif";
    return `bold ${size}px ${fam}`;
  }

  // Skitch-style halo: outline in whichever contrasts with the fill color
  function contrastFor(hex) {
    const n = parseInt(hex.slice(1), 16);
    const lum = .299 * (n >> 16 & 255) + .587 * (n >> 8 & 255) + .114 * (n & 255);
    return lum > 160 ? 'rgba(17,19,26,.9)' : 'rgba(255,255,255,.93)';
  }

  let editor = null;
  function openTextEditor(p) {
    closeTextEditor(true);
    const scale = viewScale();
    const fontSize = FONTS[sizeKey];
    editor = document.createElement('textarea');
    editor.id = 'textEditor';
    editor.spellcheck = false;
    const st = editor.style;
    st.left = (p.x * scale - 5.5) + 'px';
    st.top = (p.y * scale - 3.5) + 'px';
    st.font = textFont(fontSize * scale);
    st.color = color;
    st.caretColor = color;
    wrap.appendChild(editor);
    const size = () => {
      octx.font = textFont(fontSize);
      let w = 30;
      editor.value.split('\n').forEach(l => { w = Math.max(w, octx.measureText(l).width); });
      st.width = (w * scale + 26) + 'px';
      st.height = (editor.value.split('\n').length * fontSize * 1.22 * scale + 10) + 'px';
    };
    size();
    editor.addEventListener('input', size);
    editor.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); closeTextEditor(true); }
      else if (e.key === 'Escape') closeTextEditor(false);
    });
    editor.addEventListener('blur', () => closeTextEditor(true));
    editor._commit = { x: p.x, y: p.y, fontSize, color };
    setTimeout(() => editor && editor.focus(), 0);
  }

  function closeTextEditor(commit) {
    if (!editor) return;
    const ed = editor;
    editor = null;                       // guard against blur re-entry
    const text = ed.value.replace(/\s+$/, '');
    if (commit && text) {
      snapshot();
      shapes.push({ tool: 'text', ...ed._commit, text });
      redrawBase();
      syncButtons();
    }
    ed.remove();
  }

  // ---------- Hand-drawn (sketchy) rendering ----------
  // Deterministic per-shape randomness so the wobble doesn't change on redraws
  function mulberry32(seed) {
    let a = seed >>> 0;
    return () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function roughness(s) { return Math.max(2, Math.min(7, s.lw * 0.55)); }

  // Two diverging strokes: a main one plus a lighter, thinner "retrace" —
  // the sketch texture comes from them not agreeing. Thick strokes get one
  // pass (two smear into a blob).
  function sketchPasses(ctx, s, draw) {
    const passes = s.lw > 12 ? 1 : 2;
    const rng = mulberry32(s.seed || 1);
    const r = roughness(s);
    for (let p = 0; p < passes; p++) {
      ctx.beginPath();
      ctx.globalAlpha = p === 0 ? 1 : 0.5;
      ctx.lineWidth = p === 0 ? s.lw * (passes === 1 ? 0.95 : 0.8) : Math.max(1, s.lw * 0.55);
      draw(rng, r);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // A hand stroke isn't jittery — it bows in one smooth curve, overshoots
  // its endpoints a little, and doesn't hit them exactly.
  function sketchLine(ctx, rng, x0, y0, x1, y1, r) {
    const dx = x1 - x0, dy = y1 - y0;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const px = -uy, py = ux;
    const ov = () => rng() * r * 1.4;
    const jit = k => (rng() - .5) * r * k;
    const sx = x0 - ux * ov() + px * jit(.8), sy = y0 - uy * ov() + py * jit(.8);
    const ex = x1 + ux * ov() + px * jit(.8), ey = y1 + uy * ov() + py * jit(.8);
    const bow = (rng() - .5) * 2 * Math.min(len * .05, r * 2.5);
    ctx.moveTo(sx, sy);
    if (len < 110) {
      ctx.quadraticCurveTo(
        (sx + ex) / 2 + px * (bow + jit(.7)), (sy + ey) / 2 + py * (bow + jit(.7)),
        ex, ey);
    } else {
      // long stroke: two joined curves so it doesn't read as one clean arc
      const t1 = .4 + rng() * .2;
      const mx = sx + (ex - sx) * t1 + px * (bow + jit(1));
      const my = sy + (ey - sy) * t1 + py * (bow + jit(1));
      ctx.quadraticCurveTo(
        sx + (ex - sx) * t1 / 2 + px * (bow * .6 + jit(.8)),
        sy + (ey - sy) * t1 / 2 + py * (bow * .6 + jit(.8)), mx, my);
      ctx.quadraticCurveTo(
        sx + (ex - sx) * (1 + t1) / 2 + px * (bow * .8 + jit(.8)),
        sy + (ey - sy) * (1 + t1) / 2 + py * (bow * .8 + jit(.8)), ex, ey);
    }
  }

  // Hand-drawn ellipse: smooth low-frequency squash instead of per-point
  // jitter, drawn slightly past a full turn with the radius drifting so the
  // ends overlap without lining up.
  function sketchEllipse(ctx, rng, cx, cy, rx, ry, r) {
    const steps = Math.max(14, Math.round((rx + ry) / 10));
    const start = rng() * Math.PI * 2;
    const total = Math.PI * 2 + .3 + rng() * .5;
    const p1 = rng() * Math.PI * 2, p2 = rng() * Math.PI * 2;
    const amp = Math.min(r * 1.3, Math.min(rx, ry) * .12 + 1);
    const drift = (rng() < .5 ? -1 : 1) * r * 1.5;
    const pts = [];
    for (let i = 0; i <= steps; i++) {
      const a = start + (i / steps) * total;
      const dr = amp * Math.sin(a * 2 + p1) + amp * .6 * Math.sin(a * 3 + p2)
               + (rng() - .5) * r * .4 + (i / steps) * drift;
      pts.push([cx + Math.cos(a) * (rx + dr), cy + Math.sin(a) * (ry + dr)]);
    }
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length - 1; i++) {
      ctx.quadraticCurveTo(pts[i][0], pts[i][1],
        (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
    }
    ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
  }

  function renderShape(ctx, s) {
    ctx.save();
    ctx.strokeStyle = s.color;
    ctx.fillStyle = s.color;
    ctx.lineWidth = s.lw;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (s.tool === 'highlighter') {
      ctx.globalAlpha = 0.4;
      ctx.lineCap = 'butt';
    }
    switch (s.tool) {
      case 'pen':
      case 'highlighter': {
        ctx.beginPath();
        const pts = s.points;
        ctx.moveTo(pts[0].x, pts[0].y);
        if (pts.length === 1) {
          ctx.lineTo(pts[0].x + .01, pts[0].y + .01);
        } else {
          for (let i = 1; i < pts.length - 1; i++) {
            const mx = (pts[i].x + pts[i + 1].x) / 2;
            const my = (pts[i].y + pts[i + 1].y) / 2;
            ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
          }
          const last = pts[pts.length - 1];
          ctx.lineTo(last.x, last.y);
        }
        ctx.stroke();
        break;
      }
      case 'arrow': {
        const { x0, y0, x1, y1 } = s;
        const angle = Math.atan2(y1 - y0, x1 - x0);
        const head = Math.max(10, s.lw * 3.2);
        if (handDrawn) {
          const hx1 = x1 - head * Math.cos(angle - Math.PI / 6.5), hy1 = y1 - head * Math.sin(angle - Math.PI / 6.5);
          const hx2 = x1 - head * Math.cos(angle + Math.PI / 6.5), hy2 = y1 - head * Math.sin(angle + Math.PI / 6.5);
          sketchPasses(ctx, s, (rng, r) => {
            sketchLine(ctx, rng, x0, y0, x1, y1, r);
            sketchLine(ctx, rng, x1, y1, hx1, hy1, r);
            sketchLine(ctx, rng, x1, y1, hx2, hy2, r);
          });
          break;
        }
        // shorten shaft so it doesn't poke through the head
        const sx = x1 - Math.cos(angle) * head * 0.6;
        const sy = y1 - Math.sin(angle) * head * 0.6;
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(sx, sy);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x1 - head * Math.cos(angle - Math.PI / 6.5), y1 - head * Math.sin(angle - Math.PI / 6.5));
        ctx.lineTo(x1 - head * Math.cos(angle + Math.PI / 6.5), y1 - head * Math.sin(angle + Math.PI / 6.5));
        ctx.closePath();
        ctx.fill();
        break;
      }
      case 'sarrow': {
        // Skitch-style arrow: filled shape, thin at the tail, widening into
        // a big solid triangular head
        const { x0, y0, x1, y1 } = s;
        const dx = x1 - x0, dy = y1 - y0;
        const len = Math.hypot(dx, dy);
        if (len < 2) break;
        const ux = dx / len, uy = dy / len;
        const px = -uy, py = ux;
        const headLen = Math.min(len * .45, Math.max(18, s.lw * 4.5));
        const headW = Math.max(16, s.lw * 4);
        const baseW = Math.max(5, s.lw * 1.6);
        const tailW = Math.max(1.5, s.lw * .45);
        const bx = x1 - ux * headLen, by = y1 - uy * headLen;
        const pts = [
          [x0 + px * tailW / 2, y0 + py * tailW / 2],
          [bx + px * baseW / 2, by + py * baseW / 2],
          [bx + px * headW / 2, by + py * headW / 2],
          [x1, y1],
          [bx - px * headW / 2, by - py * headW / 2],
          [bx - px * baseW / 2, by - py * baseW / 2],
          [x0 - px * tailW / 2, y0 - py * tailW / 2],
        ];
        ctx.beginPath();
        if (handDrawn) {
          const rng = mulberry32(s.seed || 1);
          // roughness follows the head size so big arrows visibly sketch
          const r = Math.max(2.5, Math.min(8, headW * .15, len * .05));
          const j = pts.map(p => [p[0] + (rng() - .5) * r * 1.4, p[1] + (rng() - .5) * r * 1.4]);
          ctx.moveTo(j[0][0], j[0][1]);
          for (let i = 1; i <= j.length; i++) {
            const a = j[i - 1], b = j[i % j.length];
            const k = Math.min(Math.hypot(b[0] - a[0], b[1] - a[1]) * .08, r * 1.6);
            ctx.quadraticCurveTo(
              (a[0] + b[0]) / 2 + (rng() - .5) * 2 * k,
              (a[1] + b[1]) / 2 + (rng() - .5) * 2 * k,
              b[0], b[1]);
          }
        } else {
          ctx.moveTo(pts[0][0], pts[0][1]);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
        }
        ctx.closePath();
        ctx.fill();
        break;
      }
      case 'rect': {
        const x = Math.min(s.x0, s.x1), y = Math.min(s.y0, s.y1);
        const w = Math.abs(s.x1 - s.x0), h = Math.abs(s.y1 - s.y0);
        if (handDrawn) {
          sketchPasses(ctx, s, (rng, r) => {
            sketchLine(ctx, rng, x, y, x + w, y, r);
            sketchLine(ctx, rng, x + w, y, x + w, y + h, r);
            sketchLine(ctx, rng, x + w, y + h, x, y + h, r);
            sketchLine(ctx, rng, x, y + h, x, y, r);
          });
          break;
        }
        const r = Math.min(6, w / 2, h / 2);
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
        ctx.stroke();
        break;
      }
      case 'text': {
        ctx.font = textFont(s.fontSize);
        ctx.textBaseline = 'top';
        ctx.lineJoin = 'round';
        ctx.lineWidth = Math.max(2.5, s.fontSize / 6.5);
        ctx.strokeStyle = contrastFor(s.color);
        const lh = s.fontSize * 1.22;
        s.text.split('\n').forEach((ln, i) => {
          ctx.strokeText(ln, s.x, s.y + i * lh);
          ctx.fillText(ln, s.x, s.y + i * lh);
        });
        break;
      }
      case 'oval': {
        const cx = (s.x0 + s.x1) / 2, cy = (s.y0 + s.y1) / 2;
        const rx = Math.abs(s.x1 - s.x0) / 2, ry = Math.abs(s.y1 - s.y0) / 2;
        if (handDrawn) {
          sketchPasses(ctx, s, (rng, r) => sketchEllipse(ctx, rng, cx, cy, rx, ry, r));
          break;
        }
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        ctx.stroke();
        break;
      }
    }
    ctx.restore();
  }

  function drawShapeOnBase(s) { renderShape(bctx, s); }

  function redrawBase() {
    bctx.clearRect(0, 0, base.width, base.height);
    if (img) bctx.drawImage(img, 0, 0);
    shapes.forEach(s => renderShape(bctx, s));
  }

  // ---------- Undo / redo ----------
  function undo() {
    if (!history.length) return;
    future.push(shapes);
    shapes = history.pop();
    selected = null;
    redrawBase();
    drawSel();
    syncButtons();
  }
  function redo() {
    if (!future.length) return;
    history.push(shapes);
    shapes = future.pop();
    selected = null;
    redrawBase();
    drawSel();
    syncButtons();
  }

  // ---------- Copy ----------
  async function copyResult() {
    if (!img) return;
    try {
      // Safari requires the promise to be passed to ClipboardItem synchronously
      const blobPromise = new Promise((res, rej) =>
        base.toBlob(b => b ? res(b) : rej(new Error('toBlob failed')), 'image/png'));
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blobPromise })]);
      toast('Copied to clipboard');
    } catch (err) {
      try {
        const blob = await new Promise((res, rej) =>
          base.toBlob(b => b ? res(b) : rej(new Error('toBlob failed')), 'image/png'));
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        toast('Copied to clipboard');
      } catch (err2) {
        toast('Copy failed — check clipboard permissions', true);
      }
    }
  }

  let toastTimer;
  function toast(msg, isError) {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.querySelector('.check').textContent = isError ? '✕' : '✓';
    t.querySelector('.check').style.color = isError ? '#f87171' : '#4ade80';
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ---------- Hand-drawn toggle ----------
  const handDrawnCb = document.getElementById('handDrawnCb');
  handDrawnCb.checked = handDrawn;
  handDrawnCb.addEventListener('change', () => {
    handDrawn = handDrawnCb.checked;
    localStorage.setItem('handDrawn', handDrawn ? '1' : '0');
    redrawBase();
  });

  // ---------- Auto paste ----------
  const autoPasteCb = document.getElementById('autoPasteCb');
  let autoPaste = localStorage.getItem('autoPaste') === '1';
  autoPasteCb.checked = autoPaste;
  autoPasteCb.addEventListener('change', () => {
    autoPaste = autoPasteCb.checked;
    localStorage.setItem('autoPaste', autoPaste ? '1' : '0');
    if (autoPaste) tryAutoPaste();
  });

  async function tryAutoPaste() {
    if (img || !navigator.clipboard || !navigator.clipboard.read) return;
    try {
      const items = await navigator.clipboard.read();
      for (const item of items) {
        const type = item.types.find(t => t.startsWith('image/'));
        if (type) {
          handleBlob(await item.getType(type));
          return;
        }
      }
    } catch (err) {
      // No permission, document not focused, or non-image clipboard — stay on empty state
    }
  }

  if (autoPaste && document.hasFocus()) tryAutoPaste();
  // Also fire when returning to an empty tab (e.g. right after taking a screenshot)
  window.addEventListener('focus', () => {
    if (autoPaste && !img) tryAutoPaste();
  });

  // ---------- Keyboard shortcuts ----------
  window.addEventListener('keydown', e => {
    if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return;
    const mod = e.metaKey || e.ctrlKey;

    if ((e.code === 'Backspace' || e.code === 'Delete') && selected && !mod) {
      e.preventDefault();
      deleteSelected();
      return;
    }
    if (e.code === 'Escape' && selected) {
      selected = null;
      drawSel();
      return;
    }

    if (mod && e.shiftKey && e.code === 'KeyC') {
      e.preventDefault();
      copyResult();
      return;
    }
    if (mod && e.code === 'KeyZ') {
      e.preventDefault();
      e.shiftKey ? redo() : undo();
      return;
    }
    if (mod) return;

    switch (e.code) {
      case 'KeyV': setTool('select'); break;
      case 'KeyP': setTool('pen'); break;
      case 'KeyH': setTool('highlighter'); break;
      case 'KeyA': setTool('arrow'); break;
      case 'KeyS': setTool('sarrow'); break;
      case 'KeyT': setTool('text'); break;
      case 'KeyR': setTool('rect'); break;
      case 'KeyO': setTool('oval'); break;
    }
  });

  syncButtons();
})();
</script>
</body>
</html>
